# Integración continua (BD-014, docs/13 y docs/15 §5). Cada PR y cada push a develop/master se
# validan en máquinas de GitHub: calidad, integración con SQL Server en contenedor, build con su
# artefacto, y E2E y Lighthouse contra ese artefacto. El build de cada entorno (staging, producción) NO sale de
# aquí: se hace en el agente interno con su propia BD y sus NEXT_PUBLIC_* (BD-141).
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  # Corrida nocturna sobre develop (docs/13: Lighthouse CI + nocturno): 03:00 en Guatemala.
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Solo en PR: un push nuevo deja obsoleta la corrida anterior. En develop y master cada merge
  # termina su corrida (y su artefacto).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Valores de prueba (como .env.example): sin secretos reales. La BD solo existe en el contenedor.
  APP_ENV: development
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  DATABASE_URL: sqlserver://127.0.0.1:1433;database=BolikDigital_Dev;user=bolik_app;password=sin-uso;encrypt=true;trustServerCertificate=true
  SESSION_SECRET: cambia-esto-por-32-caracteres-o-mas-aleatorios
  MAIL_SALES_TO: ventas@bolik66.com
  MEDIA_DIR: ./.media

jobs:
  calidad:
    name: Calidad
    if: github.event_name != 'schedule' # de noche solo Build y Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ningún paso usa git después
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage

  integracion:
    name: Integración
    if: github.event_name != 'schedule' # de noche solo Build y Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ningún paso usa git después
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SQL Server en contenedor
        # Red de seguridad: si algo se cuelga igual, falla el paso y no se cancela todo el trabajo.
        timeout-minutes: 5
        run: bash scripts/ci/sqlserver.sh
      - run: pnpm test:int
      # BD-032: el build con DATA_SOURCE=db (el de staging y producción) contra la base de pruebas
      # sembrada; después se sirve con la base desconectada: no debe consultarla en cada petición.
      - name: Sembrar la base de pruebas (perfil e2e)
        run: pnpm db:seed --profile e2e
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Build con DATA_SOURCE=db
        run: pnpm build
        env:
          DATA_SOURCE: db
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Servir el build sin base
        timeout-minutes: 3
        run: bash scripts/ci/smoke-db-build.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ningún paso usa git después
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # node_modules plano (sin los enlaces de pnpm) para que el paquete también se extraiga y
      # arranque en Windows: con enlaces, tar no puede recrearlos sin permisos especiales.
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - run: pnpm build
      - name: Armar el paquete (docs/15 §5)
        run: bash scripts/ci/package.sh "bolik-${GITHUB_SHA::7}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bolik-standalone
          path: bolik-*.tar.gz
          if-no-files-found: error
          # El de cada noche solo sirve para medir: se guarda menos.
          retention-days: ${{ github.event_name == 'schedule' && 7 || 90 }}

  artefacto-windows:
    name: Artefacto en Windows
    if: github.event_name != 'schedule' # de noche solo Build y Lighthouse
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bolik-standalone
      # El servidor de producción es Windows (IIS): el paquete debe extraerse y arrancar ahí.
      - name: Extraer y arrancar con node server.js
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem bolik-*.tar.gz).FullName
          $app = Join-Path $env:RUNNER_TEMP "bolik-app"
          New-Item -ItemType Directory $app | Out-Null
          tar -xzf $pkg -C $app
          if ($LASTEXITCODE -ne 0) { throw "tar no pudo extraer el paquete" }
          # El adaptador de SQL Server va fuera del bundle (serverExternalPackages, BD-032): con
          # DATA_SOURCE=db el servidor lo importa (ESM) por un enlace de .next/node_modules. Debe
          # cargar desde el paquete, y con él mssql y tedious desde la raíz.
          $prisma = Join-Path $app ".next/node_modules/@prisma"
          $adapters = @(Get-ChildItem $prisma -Directory -Filter "adapter-mssql*")
          if ($adapters.Count -eq 0) { throw "El paquete no trae el adaptador de SQL Server en $prisma" }
          Push-Location (Join-Path $app ".next")
          foreach ($dir in $adapters) {
            node --input-type=module -e "const m = await import(process.argv[1]); if (!m.PrismaMssql) throw new Error('sin PrismaMssql')" "@prisma/$($dir.Name)"
            if ($LASTEXITCODE -ne 0) { throw "No carga $($dir.Name) (con mssql y tedious) desde el paquete" }
          }
          Pop-Location
          "El adaptador de SQL Server carga desde el paquete"
          # sharp (BD-034) carga un binario por plataforma: el paquete se arma en Linux y debe traer
          # el de Windows (supportedArchitectures + outputFileTracingIncludes). Se prueba generando
          # un WebP de verdad, no solo cargando el módulo.
          Push-Location $app
          node -e "require('sharp')({ create: { width: 2, height: 2, channels: 3, background: { r: 0, g: 0, b: 0 } } }).webp().toBuffer().then((b) => { if (!b.length) process.exit(1) }, (e) => { console.error(e.message); process.exit(1) })"
          if ($LASTEXITCODE -ne 0) { throw "sharp no carga en Windows desde el paquete" }
          Pop-Location
          "sharp genera WebP en Windows desde el paquete"
          $env:PORT = "3100"; $env:HOSTNAME = "127.0.0.1"
          $log = Join-Path $env:RUNNER_TEMP "server.log"
          $server = Start-Process node -ArgumentList "server.js" -WorkingDirectory $app -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $html = $null
          foreach ($i in 1..60) {
            if ($server.HasExited) { break }
            try {
              $res = Invoke-WebRequest http://127.0.0.1:3100/ -UseBasicParsing -TimeoutSec 5
              if ($res.StatusCode -eq 200 -and $res.Content -match "<h1") { $html = $res.Content; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $html) {
            Get-Content $log, "$log.err"
            throw "El artefacto no respondió en Windows"
          }
          # Los estáticos que package.sh copia dentro del paquete también se sirven.
          $css = [regex]::Match($html, '/_next/static/[^"]+.css').Value
          if (-not $css) { throw "La home no enlaza ningún CSS de /_next/static" }
          $res = Invoke-WebRequest "http://127.0.0.1:3100$css" -UseBasicParsing -TimeoutSec 5
          if ($res.StatusCode -ne 200) { throw "CSS $css respondió $($res.StatusCode)" }
          "El artefacto responde en Windows (home y $css)"
          Stop-Process -Id $server.Id

  e2e:
    name: E2E
    if: github.event_name != 'schedule' # de noche solo Build y Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagen oficial de Playwright: trae Chromium, WebKit y sus dependencias. Sin ella, cada corrida
    # bajaba 139 MB con apt y dos veces se colgó 20 min en el espejo de Ubuntu. Misma versión que
    # @playwright/test (lo comprueba el primer paso); al actualizar Playwright, cambiar tag y digest.
    # --user 1001: el usuario del runner (permisos del workspace); --ipc=host: memoria para Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ningún paso usa git después
      - name: La imagen de Playwright coincide con @playwright/test
        run: node scripts/ci/check-playwright-image.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bolik-standalone
      - name: Arrancar el artefacto con node server.js
        run: bash scripts/ci/serve-artifact.sh bolik-*.tar.gz
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
      - name: Log del servidor
        if: failure()
        run: cat "${RUNNER_TEMP}/server.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # comentario con el resumen en el PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # ningún paso usa git después
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bolik-standalone
      - name: Arrancar el artefacto con node server.js
        run: bash scripts/ci/serve-artifact.sh bolik-*.tar.gz
      # Presupuestos de docs/12 en lighthouse.config.cjs: si uno no se cumple, el trabajo falla.
      - run: pnpm lhci
        env:
          LHCI_BASE_URL: http://127.0.0.1:3100
      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci/lhci-report.mjs > "${RUNNER_TEMP}/lhci-report.md"
          cat "${RUNNER_TEMP}/lhci-report.md" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 30
      # Un solo comentario por PR, que se actualiza en cada push. Los PR desde un fork no tienen
      # permiso de escritura: ahí el resumen queda solo en la corrida.
      - name: Comentario en el PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" --edit-last --create-if-none --body-file "${RUNNER_TEMP}/lhci-report.md"
      - name: Log del servidor
        if: failure()
        run: cat "${RUNNER_TEMP}/server.log"
