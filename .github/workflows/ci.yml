# Integración continua (BD-014, docs/13 y docs/15 §5). Cada PR y cada push a develop/master se
# validan en máquinas de GitHub: calidad, integración con SQL Server en contenedor, build con su
# artefacto y E2E contra ese artefacto. El build de cada entorno (staging, producción) NO sale de
# aquí: se hace en el agente interno con su propia BD y sus NEXT_PUBLIC_* (BD-016).
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Valores de prueba (como .env.example): sin secretos reales. La BD solo existe en el contenedor.
  APP_ENV: development
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  DATABASE_URL: sqlserver://127.0.0.1:1433;database=BolikDigital_Dev;user=bolik_app;password=sin-uso;encrypt=true;trustServerCertificate=true
  SESSION_SECRET: cambia-esto-por-32-caracteres-o-mas-aleatorios
  MAIL_SALES_TO: ventas@bolik66.com
  MEDIA_DIR: ./.media

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage

  integracion:
    name: Integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SQL Server en contenedor
        run: bash scripts/ci/sqlserver.sh
      - run: pnpm test:int

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Armar el paquete (docs/15 §5)
        run: bash scripts/ci/package.sh "bolik-${GITHUB_SHA::7}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bolik-standalone
          path: bolik-*.tar.gz
          if-no-files-found: error
          retention-days: 90

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bolik-standalone
      - name: Arrancar el artefacto con node server.js
        run: bash scripts/ci/serve-artifact.sh bolik-*.tar.gz
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
      - name: Log del servidor
        if: failure()
        run: cat "${RUNNER_TEMP}/server.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
