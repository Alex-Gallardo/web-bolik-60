# Paquetes que pueden correr su script de instalación (pnpm 10 los bloquea por defecto).
# prisma y @prisma/engines descargan el motor de migraciones (schema engine).
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma

ignoredBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# sharp trae un binario por plataforma (@img/sharp-*). El paquete se construye en Linux (CI) y corre
# en Windows (IIS): se instala también el de Windows para que entre en el paquete (BD-034).
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64
